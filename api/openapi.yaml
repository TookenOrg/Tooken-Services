openapi: 3.0.3
info:
  title: Blockchain Microservice API
  version: 1.0.0
  description: Minimal API with health check

servers:
  - url: http://localhost:8080
    description: Development server
  - url: https://api.tooken.fr/api/v1 # Production
    description: Production

tags:
  - name: Auth
  - name: Blockchain
  - name: Assets
  - name: User
  - name: Issuance
  - name: Trading
  - name: Payments

paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK

  # Auth
  /auth/sign-up:
    post:
      operationId: PostAuthSignUp
      summary: Create a new user and return a JWT
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignUpResponse"
        "400":
          description: Invalid request
        "409":
          description: Email already exists

  /auth/sign-in:
    post:
      operationId: PostAuthSignIn
      summary: Auth existing user and return a JWT
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponse"
        "400":
          description: Invalid request
        "409":
          description: Email already exists

  /user/{userId}:
    get:
      operationId: GetUserById
      parameters:
        - name: userId
          in: path
          description: User ID
          required: true
          schema:
            type: integer
            format: int64
      summary: GetUserById
      tags:
        - user
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request

  # Asset
  /assets/real-estates/active:
    get:
      tags:
        - Assets
      summary: Get all real estates
      operationId: getActiveRealEstates
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RealEstate"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /assets/real-estate/issuance/orders:
    post:
      security:
        - bearerAuth: []
      operationId: createIssuanceOrder
      summary: Create a new order in primary market
      tags:
        - Assets
        - Issuance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssuanceOrderRequest"
      responses:
        "201":
          description: Subscription created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateIssuanceOrderResponse"
        "400":
          description: Invalid request

  /assets/real-estates/{id}:
    get:
      tags:
        - Assets
      summary: Get one real estate
      operationId: getRealEstateById
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealEstate"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  # Users actions
  /users/{userId}/favorites/real-estates/{realEstateId}:
    post:
      tags:
        - User
        - Assets
      summary: Save a real estate in favoris for one user
      operationId: addFavoritesRealEstateForUser
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
        - in: path
          name: realEstateId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
    delete:
      tags:
        - User
        - Assets
      summary: Save a real estate in favoris for one user
      operationId: removeFavoritesRealEstateForUser
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
        - in: path
          name: realEstateId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  # Blockchain
  /trex/init/implementations:
    post:
      tags:
        - Blockchain
        - initialize
      summary: Deploy all contracts implementations
      operationId: deployAllImplementationsAsync
      responses:
        "202":
          description: Request sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /trex/init/contract/factory/identity:
    post:
      tags:
        - Blockchain
        - initialize
      summary: Deploy identity factory
      operationId: deployIdentityFactory
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitializeIdentityFactoryResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /trex/init/authority/configure:
    post:
      tags:
        - Blockchain
        - initialize
      summary: Configure the Authority contract with the implementations addresses
      operationId: configureAuthority
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigureAuthorityResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /trex/init/contract/factory/trexFactory:
    post:
      tags:
        - Blockchain
        - initialize
      summary: Deploy TREX factory
      operationId: DeployAndInitTrexFactoryAsync
      responses:
        "202":
          description: Request sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /trex/init/suite/deploy:
    post:
      tags:
        - Blockchain
        - initialize
        - trex-suite
      summary: Deploy the TREX Suite contracts
      operationId: deployTrexSuiteAsync
      responses:
        "202":
          description: Request sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /trex/suite:
    get:
      tags:
        - Blockchain
          - trex-suite
      summary: Get deployed TREX Suite information
      operationId: getTrexSuiteInfos
      parameters:
        - name: salt
          in: query
          required: false
          schema:
            type: string
          description: Salt used for the TREX Suite deployment (optional, uses default if not provided)
      responses:
        "200":
          description: TREX Suite information retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrexSuiteInfos"
        "404":
          description: TREX Suite not found for the given salt
        "500":
          description: Internal server error

  /contract/identity:
    post:
      tags:
        - Blockchain
        - contract
        - identity
      summary: Create new Identity contract and add it to the registry
      operationId: createIdentity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIdentityRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateIdentityResponse"

  /contract/identity/claims/add:
    post:
      tags:
        - Blockchain
        - contract
        - identity
      summary: Add a claim to an identity
      operationId: addClaimToIdentity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddClaimRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddClaimResponse"

  /contract/token:
    post:
      tags:
        - Blockchain
        - contract
        - token
      summary: Create a new Token
      operationId: createTokenContract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Token deployed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTokenResponse"
        "500":
          description: Internal server error

  /contract/token/{tokenAddress}/infos:
    get:
      tags:
        - Blockchain
        - contract
        - token
      summary: Get informations from contract Token
      operationId: getTokenInfos
      parameters:
        - name: tokenAddress
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenInfos"

  /contract/token/mint:
    post:
      tags:
        - Blockchain
        - contract
        - token
      summary: Register the given amount for the userId in the sharetoken
      operationId: mintTokenAsync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MintTokenRequest"
      responses:
        "202":
          description: Token minted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintTokenResponse"

  /contract/token/burn:
    post:
      tags:
        - Blockchain
        - contract
        - token
      summary: Withdraw the given amount for the userId in the sharetoken
      operationId: burnTokenAsync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BurnTokenRequest"
      responses:
        "202":
          description: Token minted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BurnTokenResponse"

  /payments/add:
    post:
      tags:
        - Payments
      summary: Add a payment
      operationId: paymentAdd
      responses:
        "200":
          description: Payment added
        "500":
          description: Internal server error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    APIResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        data:
          nullable: true
          x-oapi-codegen-extra-tags:
            json: ",omitempty"

    JwtToken:
      type: object
      required:
        - token
        - refreshToken
        - user
        - expiresAt
      properties:
        token:
          type: string
        refreshToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"

    SignUpRequest:
      type: object
      required:
        - fullName
        - email
        - password
      properties:
        fullName:
          type: string
          example: "Antony Lefèvre"
        email:
          type: string
          format: email
          example: "anto@example.com"
        password:
          type: string
          format: password
          example: "supersecret"

    SignUpResponse:
      allOf:
        - $ref: "#/components/schemas/APIResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/JwtToken"

    SignInRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "anto@example.com"
        password:
          type: string
          format: password
          example: "supersecret"

    SignInResponse:
      allOf:
        - $ref: "#/components/schemas/APIResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/JwtToken"

    User:
      type: object
      required:
        - id
        - full_name
        - email
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          description: ID unique de l'utilisateur
          example: 1
        full_name:
          type: string
          description: Nom complet de l'utilisateur
          example: "Antony Lefèvre"
        email:
          type: string
          format: email
          description: Email de l'utilisateur
          example: "anto@example.com"
        created_at:
          type: string
          format: date-time
          description: Date de création du compte
          example: "2026-01-01T12:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Date de dernière mise à jour
          example: "2026-01-01T12:00:00Z"
        last_connexion:
          type: string
          format: date-time
          nullable: true
          description: Date de la dernière connexion
          example: "2026-01-10T15:30:00Z"

    InitializeIdentityFactoryResponse:
      allOf:
        - $ref: "#/components/schemas/APIResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ContractDetails"

    ConfigureAuthorityResponse:
      allOf:
        - $ref: "#/components/schemas/APIResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TxHashName"

    CreateIdentityRequest:
      type: object
      required:
        - countryCode
        - userId
      properties:
        countryCode:
          type: integer
          description: The country code of the investor
          example: 442
        userId:
          type: integer
          description: The user ID of the investor
          example: 123456

    CreateIdentityResponse:
      allOf:
        - $ref: "#/components/schemas/APIResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/IdentityInfos"

    IdentityInfos:
      type: object
      required:
        - identityAddress
        - walletAddress
        - countryCode
        - transactionHash
        - userId
      properties:
        identityAddress:
          type: string
          description: The address of the created identity
          example: "0xabcdefabcdefabcdefabcdefabcdefabcdefabcd"
        walletAddress:
          type: string
          description: The wallet address of the investor
          example: "0x1234567890abcdef1234567890abcdef12345678"
        countryCode:
          type: integer
          description: The country code of the investor
          example: 442
        transactionHash:
          type: string
          description: The hash of the transaction
          example: "0x15e854a3e0e21492e9381e90f4a34c6596966d3ffedcc62c17e1e70721019119"
        userId:
          type: integer
          description: The user ID of the investor
          example: 123456

    MintTokenRequest:
      type: object
      required:
        - tokenContractAddress
        - to
        - amount
      properties:
        tokenContractAddress:
          type: string
          description: The address of the token contract
          example: "0x1234567890abcdef1234567890abcdef12345678"
        amount:
          type: number
          format: double
          description: The amount of tokens to mint, in human format (not wei)
          example: 1000.87
        to:
          type: string
          description: The address to mint the tokens to
          example: "0x1234567890abcdef1234567890abcdef12345678"

    MintTokenResponse:
      allOf:
        - $ref: "#/components/schemas/APIResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TxHashName"

    BurnTokenRequest:
      type: object
      required:
        - tokenContractAddress
        - to
        - amount
      properties:
        tokenContractAddress:
          type: string
          description: The address of the token contract
          example: "0x1234567890abcdef1234567890abcdef12345678"
        amount:
          type: number
          format: double
          description: The amount of tokens to burn, in human format (not wei)
          example: 1000.87
        to:
          type: string
          description: The address to burn the tokens to
          example: "0x1234567890abcdef1234567890abcdef12345678"

    BurnTokenResponse:
      allOf:
        - $ref: "#/components/schemas/APIResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TxHashName"

    AddClaimRequest:
      type: object
      required:
        - userId
        - claimTopic
      properties:
        userId:
          type: integer
          example: 100000
        claimTopic:
          type: integer
          description: The topic of the claim (e.g., 7 for KYC)
          example: 7

    AddClaimResponse:
      allOf:
        - $ref: "#/components/schemas/APIResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TxHashName"

    TxHashName:
      type: object
      required:
        - transactionHash
        - operationName
      properties:
        transactionHash:
          type: string
          description: The hash of the transaction that performed the operation
          example: "0x1234567890abcdef1234567890abcdef123456789"
        operationName:
          type: string
          description: The name of the operation performed
          example: "CreateShareToken, initToken"

    TrexSuiteInfos:
      type: object
      required:
        - salt
        - token
        - identityRegistry
        - identityRegistryStorage
        - trustedIssuersRegistry
        - claimTopicsRegistry
        - modularCompliance
        - trexFactory
      properties:
        salt:
          type: string
          description: The salt used for the TREX Suite deployment
          example: "myTokenSalt123"
        token:
          $ref: "#/components/schemas/TokenDetails"
        identityRegistry:
          $ref: "#/components/schemas/ContractDetails"
        identityRegistryStorage:
          $ref: "#/components/schemas/ContractDetails"
        trustedIssuersRegistry:
          $ref: "#/components/schemas/ContractDetails"
        claimTopicsRegistry:
          $ref: "#/components/schemas/ContractDetails"
        modularCompliance:
          $ref: "#/components/schemas/ContractDetails"
        trexFactory:
          $ref: "#/components/schemas/ContractDetails"

    TokenDetails:
      type: object
      required:
        - address
        - name
        - symbol
        - decimals
        - totalSupply
        - explorerUrl
      properties:
        address:
          type: string
          description: The address of the token contract
          example: "0x1234567890abcdef1234567890abcdef12345678"
        name:
          type: string
          description: The name of the token
          example: "My Security Token"
        symbol:
          type: string
          description: The symbol of the token
          example: "MST"
        decimals:
          type: integer
          description: The number of decimals for the token
          example: 18
        totalSupply:
          type: string
          description: The total supply of tokens (in wei format)
          example: "1000000000000000000000000"
        explorerUrl:
          type: string
          description: Direct link to the token on Etherscan
          example: "https://sepolia.etherscan.io/token/0x1234567890abcdef1234567890abcdef12345678"

    ContractDetails:
      type: object
      required:
        - address
        - name
      properties:
        address:
          type: string
          description: The address of the contract
          example: "0x1234567890abcdef1234567890abcdef12345678"
        explorerUrl:
          type: string
          description: Direct link to the contract on Etherscan
          example: "https://sepolia.etherscan.io/address/0x1234567890abcdef1234567890abcdef12345678"
        name:
          type: string
          description: The name/type of the contract
          example: "Identity"

    CreateTokenRequest:
      type: object
      required:
        - tokenName
        - nbDecimal
      properties:
        tokenName:
          type: string
          description: Name of the token
          example: "US0378331005"
        nbDecimal:
          type: integer
          description: Number of decimals
          example: 18

    CreateTokenResponse:
      allOf:
        - $ref: "#/components/schemas/APIResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TokenInfos"

    TokenInfos:
      type: object
      required:
        - id
        - address
        - token_name
        - modularCompliance
        - symbol
        - nbDecimal
        - createdAt
      properties:
        id:
          type: integer
        modularComplianceAddr:
          type: string
          description: Address of the modularCompliance contract
          example: "0x1234567890abcdef1234567890abcdef12345678"
        address:
          type: string
          description: Address of the token contract
          example: "0x1234567890abcdef1234567890abcdef12345678"
        token_name:
          type: string
          description: Name of token
          example: "Big House"
          maxLength: 12
        symbol:
          type: string
          description: Symbol of token
          maxLength: 12
        nbDecimal:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        OnbehalfTransactions:
          type: array
          items:
            $ref: "#/components/schemas/TxHashName"
          description: A list of transactions performed on behalf of the identity

    RealEstate:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        imageurl:
          type: string
        estate_type:
          type: string
        estate_type_id:
          type: integer
        active:
          type: boolean
          description: is estate active
        created_at:
          type: string
          format: date-time
        contract_address:
          type: string
          description: Address of estate on blockchain (token)
        specificiation:
          $ref: "#/components/schemas/RealEstateSpecification"
        configuration:
          $ref: "#/components/schemas/RealEstateConfiguration"
        progression:
          $ref: "#/components/schemas/RealEstateProgression"

    RealEstateSpecification:
      type: object
      properties:
        lot_size:
          type: number
          format: float
        surface_area:
          type: number
          format: float
        bedroom_number:
          type: integer
        bathroom_number:
          type: integer
        pool_size:
          type: number
          format: float
        terrace_size:
          type: number
          format: float
        build_year:
          type: integer

    RealEstateConfiguration:
      type: object
      properties:
        total_shares:
          type: integer
        price_per_share:
          type: number
          format: float
        yield:
          type: number
          format: float
        payment_frequency:
          type: integer
        payment_frequency_type_id:
          type: integer
        payment_frequency_type:
          type: string

    RealEstateProgression:
      type: object
      properties:
        tokens_sold:
          type: integer
        tokens_sold_pctg:
          type: number
          format: float

    CreateIssuanceOrderRequest:
      type: object
      required:
        - real_estate_id
        - quantity
      properties:
        real_estate_id:
          type: integer
        quantity:
          type: integer

    CreateIssuanceOrderResponse:
      allOf:
        - $ref: "#/components/schemas/APIResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/IssuanceOrder"

    IssuanceOrder:
      type: object
      properties:
        order_ref:
          type: string
        token_quantity:
          type: integer
        real_estate_id:
          type: integer
        created_at:
          type: string
          format: date-time
        created_by:
          type: integer
