openapi: 3.0.3
info:
  title: Blockchain Microservice API
  version: 1.0.0
  description: Minimal API with health check

servers:
  - url: http://localhost:8080
    description: Development server
  - url: https://api.tooken.fr/api/v1 # Production
    description: Production

tags:
  - name: Auth
  - name: Blockchain
  - name: Assets
  - name: User
  - name: Issuance
  - name: Trading
  - name: Payments
  - name: Issuer

paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK

  # Auth
  /auth/sign-up:
    post:
      operationId: PostAuthSignUp
      summary: Create a new user and return a JWT
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignUpResponse"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "409":
          description: An account already exists for this email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "500":
          description: >
            The account could not be created, a database outage for instance.
            The cause is logged server side and never returned to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /auth/sign-in:
    post:
      operationId: PostAuthSignIn
      summary: Auth existing user and return a JWT
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: User authenticated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponse"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "401":
          description: Unknown email or wrong password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "500":
          description: >
            The credentials could not be checked at all, a database outage for
            instance. Distinct from 401 on purpose: retrying with a different
            password would not help.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /user/{userId}:
    get:
      operationId: GetUserById
      parameters:
        - name: userId
          in: path
          description: User ID
          required: true
          schema:
            type: integer
            format: int64
      summary: GetUserById
      tags:
        - user
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request

  # Asset
  /assets/real-estates/active:
    get:
      tags:
        - Assets
      summary: Get all real estates
      description: >
        Public listing. A MANAGER or ADMIN presenting a token also sees the
        assets that are not published yet, so the back office does not need a
        second endpoint.
      operationId: getActiveRealEstates
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RealEstateSummary"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /assets/real-estates/{id}/publish:
    post:
      tags:
        - Assets
      summary: Publish a real estate
      description: >
        Makes a draft visible to investors. Reserved to a MANAGER or an ADMIN.

        An asset created with everything it needs is published straight away, so
        this endpoint is only for the ones filled in over several steps.

        What is checked is the stored asset, not a payload: the decision is
        taken on the record as it stands, possibly long after it was written and
        by someone else. An asset that still lacks what an investor relies on —
        its issuer, its economics, a description, a visual — is refused with 409
        naming the missing fields, so the caller knows what to complete.

        Naming an issuer is not enough: it must still be active. Publishing an
        asset whose issuer is a draft, suspended or dissolved is refused with
        409 — the mirror of the rule that refuses to withdraw an issuer while it
        carries published assets.

        Publishing an already published asset is not an error: it changes
        nothing and returns the asset, so two managers clicking the same button
        do not produce a failure.
      operationId: publishRealEstate
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealEstate"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "403":
          description: The role does not allow publishing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "404":
          description: Real Estate Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "409":
          description: The asset is not complete enough to be published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /assets/real-estate/issuance/orders:
    post:
      security:
        - bearerAuth: []
      operationId: createIssuanceOrder
      summary: Create a new order in primary market
      tags:
        - Assets
        - Issuance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssuanceOrderRequest"
      responses:
        "201":
          description: Subscription created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateIssuanceOrderResponse"
        "400":
          description: Invalid request

  /assets/real-estate/issuance/orders/{orderRef}:
    get:
      security:
        - bearerAuth: []
      operationId: fetchIssuanceOrder
      summary: Fetch a order in primary market
      tags:
        - Issuance
      parameters:
        - in: path
          name: orderRef
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuanceOrder"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /assets/real-estates:
    post:
      tags:
        - Assets
      summary: Create a real estate
      description: >
        Creates the asset and every one-to-one section in a single transaction:
        an asset without its address or its share configuration would be a
        half-created record that no reader could use.

        The asset is created published, therefore visible: a manager clicking
        "create" expects to see the result on the site, not a draft nobody
        asked for.

        Two things hold it back as a draft instead: a payload that lacks what an
        investor relies on, and an issuer that is not active. Neither is an
        error — the asset is stored as sent and goes online through
        POST /assets/real-estates/{id}/publish once the gap is closed.
      operationId: createRealEstate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealEstateWriteRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealEstate"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "403":
          description: Reserved to MANAGER and ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /assets/real-estates/{id}:
    get:
      tags:
        - Assets
      summary: Get one real estate
      description: >
        Public detail. A MANAGER or ADMIN presenting a token additionally
        receives the street address and can read an asset that is not published
        yet; anyone else gets 404 on such an asset, so the mere existence of a
        draft is not disclosed.
      operationId: getRealEstateById
      security:
        - {}
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealEstate"
        "404":
          description: "Real Estate Not Found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

    patch:
      tags:
        - Assets
      summary: Update a real estate
      description: >
        Partial update, applied in one transaction. An omitted field keeps its
        current value, so a form that edits one section does not have to resend
        the whole asset and cannot erase what it never displayed.

        To clear an optional value, send it empty: an empty string is read as
        "no value", the same way an absent one is on a create. The media
        gallery is the exception — a list cannot be merged item by item, so a
        supplied array replaces the whole gallery.

        The merged asset is validated as a whole, not just the fields that
        changed: a patch cannot leave the asset in a state a create would have
        refused.

        Some fields stop being writable once the asset is tokenized or has
        orders: changing the number of shares under an investor who already
        bought some would rewrite his ownership. Those attempts answer 409.

        Moving a published asset onto an issuer that is not active answers 409
        as well. Only a change of issuer is checked, so an asset published under
        a vehicle since suspended stays editable — including to move it onto one
        that does stand behind it.
      operationId: patchRealEstate
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealEstatePatchRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealEstate"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "403":
          description: Reserved to MANAGER and ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "404":
          description: "Real Estate Not Found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "409":
          description: Change forbidden by the current state of the asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

    delete:
      tags:
        - Assets
      summary: Delete a real estate
      description: >
        Soft deletion: the asset is cancelled and dated, never removed. Orders
        and payments reference it, and a financial registry that can lose rows
        cannot be audited.

        A tokenized asset cannot be deleted at all: its token exists on chain
        and investors hold it. Such an attempt answers 409.
      operationId: deleteRealEstate
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "403":
          description: Reserved to MANAGER and ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "404":
          description: "Real Estate Not Found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "409":
          description: Asset is tokenized and cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /assets/issuers:
    get:
      tags:
        - Issuer
      summary: List the issuers
      description: >
        Back office listing, reserved to a MANAGER or an ADMIN. An issuer is
        the legal vehicle a token represents shares of; it is not part of the
        public catalogue, which only ever shows the issuer attached to an
        asset.

        Dissolved issuers are listed too: a manager must be able to see why an
        identifier he remembers can no longer be attached to an asset.
      operationId: getIssuers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Issuer"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "403":
          description: Reserved to MANAGER and ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

    post:
      tags:
        - Issuer
      summary: Create an issuer
      description: >
        Creates the legal vehicle an asset can then be attached to. Reserved to
        a MANAGER or an ADMIN.

        The issuer is created active: a manager filling this form is declaring
        a vehicle that exists, not planning one. An active issuer must carry
        its registration number — a vehicle assets are published under has to
        be identifiable in its register.

        A vehicle still being incorporated has no number yet: create it as a
        draft (status_id 1) and activate it once the register has assigned one.
      operationId: createIssuer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssuerWriteRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issuer"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "403":
          description: Reserved to MANAGER and ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "409":
          description: >
            The registration number, in that country, or the LEI code already
            identifies another issuer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /assets/issuers/{id}:
    get:
      tags:
        - Issuer
      summary: Get one issuer
      description: >
        Back office detail, reserved to a MANAGER or an ADMIN.
      operationId: getIssuerById
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issuer"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "403":
          description: Reserved to MANAGER and ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "404":
          description: Issuer Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

    patch:
      tags:
        - Issuer
      summary: Update an issuer
      description: >
        Partial update, same rules as an asset: an omitted field keeps its
        current value, and an optional field sent empty is cleared. The merged
        issuer is validated as a whole, so a patch cannot leave it in a state a
        creation would have refused.

        Moving an issuer out of the active status — to draft, suspended or
        dissolved — is refused with 409 while it still carries published
        assets. Doing it silently would leave investors looking at an offer
        whose vehicle no longer stands behind it. Draft counts as a withdrawal
        like the other two: an asset can only be published under an ACTIVE
        issuer.

        Activating a draft that has no registration number is refused with 409
        naming it, the same way an incomplete asset cannot be published. Supply
        the number in the same request and the activation goes through.

        Clearing the registration number of an issuer that is already active is
        refused with 409 as well: it would produce, by patch, the exact state a
        creation and an activation both refuse. Only a LOSS is refused — an
        issuer stored without a number stays fully editable, including to
        complete it.
      operationId: patchIssuer
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssuerPatchRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issuer"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "403":
          description: Reserved to MANAGER and ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "404":
          description: Issuer Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "409":
          description: Change forbidden by the current state of the issuer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

    delete:
      tags:
        - Issuer
      summary: Dissolve an issuer
      description: >
        An issuer is never removed: assets, orders and on-chain tokens refer to
        it, and a registry that can lose rows cannot be audited. The row is
        moved to the dissolved status, which is final.

        An issuer that still carries assets cannot be dissolved: answer 409,
        naming how many. Detach or delete them first.
      operationId: deleteIssuer
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Dissolved
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "403":
          description: Reserved to MANAGER and ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "404":
          description: Issuer Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "409":
          description: The issuer still carries assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  # Users actions
  /users/{userId}/favorites/real-estates/{realEstateId}:
    post:
      tags:
        - User
        - Assets
      summary: Save a real estate in favoris for one user
      operationId: addFavoritesRealEstateForUser
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
        - in: path
          name: realEstateId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
    delete:
      tags:
        - User
        - Assets
      summary: Save a real estate in favoris for one user
      operationId: removeFavoritesRealEstateForUser
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
        - in: path
          name: realEstateId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  # Blockchain
  /trex/init/implementations:
    post:
      tags:
        - Blockchain
        - initialize
      summary: Deploy all contracts implementations
      operationId: deployAllImplementationsAsync
      responses:
        "202":
          description: Request sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /trex/init/contract/factory/identity:
    post:
      tags:
        - Blockchain
        - initialize
      summary: Deploy identity factory
      operationId: deployIdentityFactory
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitializeIdentityFactoryResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /trex/init/authority/configure:
    post:
      tags:
        - Blockchain
        - initialize
      summary: Configure the Authority contract with the implementations addresses
      operationId: configureAuthority
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigureAuthorityResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /trex/init/contract/factory/trexFactory:
    post:
      tags:
        - Blockchain
        - initialize
      summary: Deploy TREX factory
      operationId: DeployAndInitTrexFactoryAsync
      responses:
        "202":
          description: Request sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /trex/init/suite/deploy:
    post:
      tags:
        - Blockchain
        - initialize
        - trex-suite
      summary: Deploy the TREX Suite contracts
      operationId: deployTrexSuiteAsync
      responses:
        "202":
          description: Request sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

  /trex/suite:
    get:
      tags:
        - Blockchain
          - trex-suite
      summary: Get deployed TREX Suite information
      operationId: getTrexSuiteInfos
      parameters:
        - name: salt
          in: query
          required: false
          schema:
            type: string
          description: Salt used for the TREX Suite deployment (optional, uses default if not provided)
      responses:
        "200":
          description: TREX Suite information retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrexSuiteInfos"
        "404":
          description: TREX Suite not found for the given salt
        "500":
          description: Internal server error

  /contract/identity:
    post:
      tags:
        - Blockchain
        - contract
        - identity
      summary: Create new Identity contract and add it to the registry
      operationId: createIdentity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIdentityRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateIdentityResponse"

  /contract/identity/claims/add:
    post:
      tags:
        - Blockchain
        - contract
        - identity
      summary: Add a claim to an identity
      operationId: addClaimToIdentity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddClaimRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddClaimResponse"

  /contract/token:
    post:
      tags:
        - Blockchain
        - contract
        - token
      summary: Create a new Token
      operationId: createTokenContract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Token deployed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTokenResponse"
        "500":
          description: Internal server error

  /contract/token/{tokenAddress}/infos:
    get:
      tags:
        - Blockchain
        - contract
        - token
      summary: Get informations from contract Token
      operationId: getTokenInfos
      parameters:
        - name: tokenAddress
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenInfos"

  /contract/token/mint:
    post:
      tags:
        - Blockchain
        - contract
        - token
      summary: Register the given amount for the userId in the sharetoken
      operationId: mintTokenAsync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MintTokenRequest"
      responses:
        "202":
          description: >-
            Mint accepted and started. The on-chain work continues in the
            background, so this status does not mean it succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "400":
          description: >-
            The request was refused before anything was sent to the chain:
            malformed address, or an amount that cannot be converted exactly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintTokenResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintTokenResponse"

  /contract/token/burn:
    post:
      tags:
        - Blockchain
        - contract
        - token
      summary: Withdraw the given amount for the userId in the sharetoken
      operationId: burnTokenAsync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BurnTokenRequest"
      responses:
        "202":
          description: >-
            Burn accepted and started. The on-chain work continues in the
            background, so this status does not mean it succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "400":
          description: >-
            The request was refused before anything was sent to the chain:
            malformed address, or an amount that cannot be converted exactly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BurnTokenResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BurnTokenResponse"

  /payments/add:
    post:
      tags:
        - Payments
      summary: Add a payment
      operationId: paymentAdd
      responses:
        "200":
          description: Payment added
        "500":
          description: Internal server error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    APIResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        data:
          nullable: true
          x-oapi-codegen-extra-tags:
            json: ",omitempty"

    JwtToken:
      type: object
      required:
        - token
        - refreshToken
        - user
        - expiresAt
      properties:
        token:
          type: string
        refreshToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"

    SignUpRequest:
      type: object
      required:
        - fullName
        - email
        - password
      properties:
        fullName:
          type: string
          example: "Antony Lefèvre"
        email:
          type: string
          format: email
          example: "anto@example.com"
        password:
          type: string
          format: password
          example: "supersecret"

    SignUpResponse:
      allOf:
        - $ref: "#/components/schemas/APIResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/JwtToken"

    SignInRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "anto@example.com"
        password:
          type: string
          format: password
          example: "supersecret"

    SignInResponse:
      allOf:
        - $ref: "#/components/schemas/APIResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/JwtToken"

    User:
      type: object
      required:
        - id
        - full_name
        - email
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          description: ID unique de l'utilisateur
          example: 1
        full_name:
          type: string
          description: Nom complet de l'utilisateur
          example: "Antony Lefèvre"
        email:
          type: string
          format: email
          description: Email de l'utilisateur
          example: "anto@example.com"
        created_at:
          type: string
          format: date-time
          description: Date de création du compte
          example: "2026-01-01T12:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Date de dernière mise à jour
          example: "2026-01-01T12:00:00Z"
        last_connexion:
          type: string
          format: date-time
          nullable: true
          description: Date de la dernière connexion
          example: "2026-01-10T15:30:00Z"
        role:
          type: string
          description: >
            Permission level of the account. The same value is carried by the
            JWT, which is what the server actually enforces; it is repeated here
            so a client can hide an action it is not allowed to perform without
            having to decode the token.
          enum: [USER, MANAGER, ADMIN]
          example: USER

    InitializeIdentityFactoryResponse:
      allOf:
        - $ref: "#/components/schemas/APIResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ContractDetails"

    ConfigureAuthorityResponse:
      allOf:
        - $ref: "#/components/schemas/APIResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TxHashName"

    CreateIdentityRequest:
      type: object
      required:
        - countryCode
        - userId
      properties:
        countryCode:
          type: integer
          description: The country code of the investor
          example: 442
        userId:
          type: integer
          description: The user ID of the investor
          example: 123456

    CreateIdentityResponse:
      allOf:
        - $ref: "#/components/schemas/APIResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/IdentityInfos"

    IdentityInfos:
      type: object
      required:
        - identityAddress
        - walletAddress
        - countryCode
        - transactionHash
        - userId
      properties:
        identityAddress:
          type: string
          description: The address of the created identity
          example: "0xabcdefabcdefabcdefabcdefabcdefabcdefabcd"
        walletAddress:
          type: string
          description: The wallet address of the investor
          example: "0x1234567890abcdef1234567890abcdef12345678"
        countryCode:
          type: integer
          description: The country code of the investor
          example: 442
        transactionHash:
          type: string
          description: The hash of the transaction
          example: "0x15e854a3e0e21492e9381e90f4a34c6596966d3ffedcc62c17e1e70721019119"
        userId:
          type: integer
          description: The user ID of the investor
          example: 123456

    MintTokenRequest:
      type: object
      required:
        - tokenContractAddress
        - to
        - amount
      properties:
        tokenContractAddress:
          type: string
          description: The address of the token contract
          example: "0x1234567890abcdef1234567890abcdef12345678"
        amount:
          type: number
          format: double
          description: >-
            The amount of tokens to mint, in human format (not wei). The request is
            refused rather than approximated when the amount cannot be converted
            exactly: it must carry at most 15 significant digits, stay below
            9007199254740992, and have no more decimals than the token declares.
            The result is written to an immutable ledger, so an amount that
            merely resembles the one requested is worse than a rejection.
          maximum: 9007199254740991
          minimum: 0
          example: 1000.87
        to:
          type: string
          description: The address to mint the tokens to
          example: "0x1234567890abcdef1234567890abcdef12345678"

    MintTokenResponse:
      allOf:
        - $ref: "#/components/schemas/APIResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TxHashName"

    BurnTokenRequest:
      type: object
      required:
        - tokenContractAddress
        - to
        - amount
      properties:
        tokenContractAddress:
          type: string
          description: The address of the token contract
          example: "0x1234567890abcdef1234567890abcdef12345678"
        amount:
          type: number
          format: double
          description: >-
            The amount of tokens to burn, in human format (not wei). The request is
            refused rather than approximated when the amount cannot be converted
            exactly: it must carry at most 15 significant digits, stay below
            9007199254740992, and have no more decimals than the token declares.
            The result is written to an immutable ledger, so an amount that
            merely resembles the one requested is worse than a rejection.
          maximum: 9007199254740991
          minimum: 0
          example: 1000.87
        to:
          type: string
          description: The address to burn the tokens to
          example: "0x1234567890abcdef1234567890abcdef12345678"

    BurnTokenResponse:
      allOf:
        - $ref: "#/components/schemas/APIResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TxHashName"

    AddClaimRequest:
      type: object
      required:
        - userId
        - claimTopic
      properties:
        userId:
          type: integer
          example: 100000
        claimTopic:
          type: integer
          description: The topic of the claim (e.g., 7 for KYC)
          example: 7

    AddClaimResponse:
      allOf:
        - $ref: "#/components/schemas/APIResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TxHashName"

    TxHashName:
      type: object
      required:
        - transactionHash
        - operationName
      properties:
        transactionHash:
          type: string
          description: The hash of the transaction that performed the operation
          example: "0x1234567890abcdef1234567890abcdef123456789"
        operationName:
          type: string
          description: The name of the operation performed
          example: "CreateShareToken, initToken"

    TrexSuiteInfos:
      type: object
      required:
        - salt
        - token
        - identityRegistry
        - identityRegistryStorage
        - trustedIssuersRegistry
        - claimTopicsRegistry
        - modularCompliance
        - trexFactory
      properties:
        salt:
          type: string
          description: The salt used for the TREX Suite deployment
          example: "myTokenSalt123"
        token:
          $ref: "#/components/schemas/TokenDetails"
        identityRegistry:
          $ref: "#/components/schemas/ContractDetails"
        identityRegistryStorage:
          $ref: "#/components/schemas/ContractDetails"
        trustedIssuersRegistry:
          $ref: "#/components/schemas/ContractDetails"
        claimTopicsRegistry:
          $ref: "#/components/schemas/ContractDetails"
        modularCompliance:
          $ref: "#/components/schemas/ContractDetails"
        trexFactory:
          $ref: "#/components/schemas/ContractDetails"

    TokenDetails:
      type: object
      required:
        - address
        - name
        - symbol
        - decimals
        - totalSupply
        - explorerUrl
      properties:
        address:
          type: string
          description: The address of the token contract
          example: "0x1234567890abcdef1234567890abcdef12345678"
        name:
          type: string
          description: The name of the token
          example: "My Security Token"
        symbol:
          type: string
          description: The symbol of the token
          example: "MST"
        decimals:
          type: integer
          description: The number of decimals for the token
          example: 18
        totalSupply:
          type: string
          description: The total supply of tokens (in wei format)
          example: "1000000000000000000000000"
        explorerUrl:
          type: string
          description: Direct link to the token on Etherscan
          example: "https://sepolia.etherscan.io/token/0x1234567890abcdef1234567890abcdef12345678"

    ContractDetails:
      type: object
      required:
        - address
        - name
      properties:
        address:
          type: string
          description: The address of the contract
          example: "0x1234567890abcdef1234567890abcdef12345678"
        explorerUrl:
          type: string
          description: Direct link to the contract on Etherscan
          example: "https://sepolia.etherscan.io/address/0x1234567890abcdef1234567890abcdef12345678"
        name:
          type: string
          description: The name/type of the contract
          example: "Identity"

    CreateTokenRequest:
      type: object
      required:
        - tokenName
        - symbol
        - nbDecimal
      properties:
        tokenName:
          type: string
          description: Name of the token
          example: "US0378331005"
        symbol:
          type: string
          description: On-chain token symbol (max 50 characters)
          example: "TOOK"
        nbDecimal:
          type: integer
          description: Number of decimals
          example: 18

    CreateTokenResponse:
      allOf:
        - $ref: "#/components/schemas/APIResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TokenInfos"

    TokenInfos:
      type: object
      required:
        - id
        - address
        - token_name
        - modularCompliance
        - symbol
        - nbDecimal
        - createdAt
      properties:
        id:
          type: integer
        modularComplianceAddr:
          type: string
          description: Address of the modularCompliance contract
          example: "0x1234567890abcdef1234567890abcdef12345678"
        address:
          type: string
          description: Address of the token contract
          example: "0x1234567890abcdef1234567890abcdef12345678"
        token_name:
          type: string
          description: Name of token
          example: "Big House"
          maxLength: 12
        symbol:
          type: string
          description: Symbol of token
          maxLength: 12
        nbDecimal:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        OnbehalfTransactions:
          type: array
          items:
            $ref: "#/components/schemas/TxHashName"
          description: A list of transactions performed on behalf of the identity

    RealEstateSummary:
      type: object
      description: >
        Real estate as served by the list endpoint. Deliberately excludes the
        street address, the media gallery, the issuer and the token: a public
        list must expose the strict minimum.
      required:
        - id
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        imageurl:
          type: string
        estate_type:
          type: string
        estate_type_id:
          type: integer
        status:
          type: string
          description: Lifecycle status code (draft, in_review, published, fundraising, funded, closed, cancelled)
        status_id:
          type: integer
        active:
          type: boolean
          description: is estate active
        created_at:
          type: string
          format: date-time
        contract_address:
          type: string
          description: Address of estate on blockchain (token)
        location:
          $ref: "#/components/schemas/RealEstateLocation"
        specification:
          $ref: "#/components/schemas/RealEstateSpecification"
        configuration:
          $ref: "#/components/schemas/RealEstateConfiguration"
        progression:
          $ref: "#/components/schemas/RealEstateProgression"

    RealEstate:
      description: >
        Full real estate record served by the detail endpoint. The street
        address is only filled for a MANAGER or an ADMIN: for everyone else the
        field is absent, because a precise address pinpoints a tokenized asset.
      allOf:
        - $ref: "#/components/schemas/RealEstateSummary"
        - type: object
          properties:
            updated_at:
              type: string
              format: date-time
            published_at:
              type: string
              format: date-time
            media:
              type: array
              items:
                $ref: "#/components/schemas/RealEstateMedia"
            token:
              $ref: "#/components/schemas/RealEstateToken"
            issuer:
              $ref: "#/components/schemas/RealEstateIssuer"
            address:
              $ref: "#/components/schemas/RealEstateAddress"

    RealEstateLocation:
      type: object
      description: >
        Coarse location, safe to expose publicly. The street, the postal code
        and the coordinates are held back: they pinpoint a tokenized asset.
      properties:
        city:
          type: string
        country_code:
          type: string
          description: ISO 3166-1 alpha-2
          example: LU

    RealEstateSpecification:
      type: object
      properties:
        lot_size:
          type: number
          format: float
        surface_area:
          type: number
          format: float
        bedroom_number:
          type: integer
        bathroom_number:
          type: integer
        pool_size:
          type: number
          format: float
        terrace_size:
          type: number
          format: float
        build_year:
          type: integer
        energy_class:
          type: string
          description: Energy performance class, A to G
          example: C
        ges_class:
          type: string
          description: Greenhouse gas class, A to G
          example: D

    RealEstateConfiguration:
      type: object
      description: >
        Amounts and share counts are carried as decimal strings. JSON has a
        single numeric type, which most parsers read as a binary double: 199.99
        comes back as 199.99001, and any integer above 2^53 is silently
        rounded. The string is a transport format, not the type of the data.
      properties:
        total_shares:
          type: string
          description: Exact integer count, NUMERIC(20,0)
          example: "1500"
        price_per_share:
          type: string
          description: Exact decimal amount, NUMERIC(20,8)
          example: "199.99"
        total_valuation:
          type: string
          description: total_shares x price_per_share, computed by the database
          example: "299985"
        currency_code:
          type: string
          description: ISO 4217
          example: EUR
        yield:
          type: number
          format: float
        payment_frequency:
          type: integer
        payment_frequency_type_id:
          type: integer
        payment_frequency_type:
          type: string

    RealEstateProgression:
      type: object
      properties:
        tokens_sold:
          type: integer
          description: >
            Shares held by non-cancelled issuance orders. An integer, because
            an order quantity is an integer; only total_shares needs a string.
        tokens_sold_pctg:
          type: number
          format: float

    RealEstateMedia:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
        alt_text:
          type: string
        media_type:
          type: string
          description: image, video, floorplan or virtual_tour
        position:
          type: integer
        is_cover:
          type: boolean

    RealEstateToken:
      type: object
      description: The ERC-3643 contract of the asset. Absent means not tokenized yet.
      properties:
        id:
          type: integer
        symbol:
          type: string
        token_name:
          type: string
        address:
          type: string
        nb_decimal:
          type: integer

    RealEstateIssuer:
      type: object
      description: The legal vehicle issuing the shares.
      properties:
        id:
          type: integer
        name:
          type: string
        legal_form:
          type: string
        country_code:
          type: string
          description: ISO 3166-1 alpha-2
        status:
          type: string

    Issuer:
      type: object
      description: >
        The legal vehicle issuing the shares, as stored. Richer than
        RealEstateIssuer, which is the trimmed view embedded in a public asset.
      required:
        - id
        - name
        - legal_form
        - country_code
        - status_id
        - status
      properties:
        id:
          type: integer
        name:
          type: string
        legal_form:
          type: string
        registration_number:
          type: string
          description: Registration number in the jurisdiction of country_code
        country_code:
          type: string
          description: ISO 3166-1 alpha-2
        lei_code:
          type: string
          description: Legal Entity Identifier, 20 upper-case alphanumerics
        status_id:
          type: integer
          description: Identifier from ass.issuer_status
        status:
          type: string
          description: Status code — draft, active, suspended or dissolved
        real_estate_count:
          type: integer
          description: >
            How many non-deleted assets are attached to this issuer. It is what
            tells a manager whether withdrawing it from service is possible.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    IssuerWriteRequest:
      type: object
      description: >
        Full definition of an issuer. name, legal_form and country_code are
        required: a vehicle without a name, a legal form or a jurisdiction
        describes nothing an investor could rely on.
      required:
        - name
        - legal_form
        - country_code
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        legal_form:
          type: string
          minLength: 1
          maxLength: 100
          description: SA, SARL, SCSp, RAIF...
        registration_number:
          type: string
          maxLength: 64
          description: >
            Registration number in the jurisdiction of country_code — the RCS
            number in Luxembourg.

            Required for an active issuer: a vehicle assets are attached to and
            published under must be identifiable in its register, which is an
            investor's only way to check that it exists. A vehicle still being
            incorporated does not have one yet, so it is created as a draft
            (status_id 1) and gets its number when the register assigns it.

            Unique within its jurisdiction. Two issuers sharing one in the same
            country are refused with 409.
        country_code:
          type: string
          description: ISO 3166-1 alpha-2, upper case
        lei_code:
          type: string
          description: >
            Legal Entity Identifier — exactly 20 upper-case alphanumerics.

            Always optional: a LEI is only mandatory for entities under market
            reporting obligations or whose securities are admitted to trading,
            so a vehicle placed privately may legitimately have none. It is
            globally unique by construction, so a duplicate is refused.
        status_id:
          type: integer
          description: >
            Identifier from ass.issuer_status. Defaults to active (2) on a
            creation; send 1 to keep the issuer as a draft while it is still
            being incorporated. An issuer cannot be created dissolved (4).

    IssuerPatchRequest:
      type: object
      description: >
        Fields to change. An omitted field keeps its current value; an optional
        field sent empty is cleared.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        legal_form:
          type: string
          minLength: 1
          maxLength: 100
        registration_number:
          type: string
        country_code:
          type: string
          description: ISO 3166-1 alpha-2, upper case
        lei_code:
          type: string
        status_id:
          type: integer

    RealEstateAddress:
      type: object
      description: >
        Full postal address. Served only to a MANAGER or an ADMIN; the public
        answer carries RealEstateLocation instead.
      required:
        - street
        - postal_code
        - city
        - country_code
      properties:
        street:
          type: string
        street_complement:
          type: string
        postal_code:
          type: string
        city:
          type: string
        region:
          type: string
        country_code:
          type: string
          description: ISO 3166-1 alpha-2
          example: LU
        latitude:
          type: string
          description: Exact decimal, NUMERIC(9,6). Set together with longitude or not at all.
          example: "49.611622"
        longitude:
          type: string
          description: Exact decimal, NUMERIC(9,6). Set together with latitude or not at all.
          example: "6.131935"

    RealEstateWriteRequest:
      type: object
      description: >
        Whole asset in one payload. The sections are written in a single
        transaction, so the request either creates a complete asset or changes
        nothing at all.
      required:
        - title
        - address
        - estate_type_id
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 2000
        imageurl:
          type: string
          maxLength: 500
        estate_type_id:
          type: integer
          description: >
            Identifier from ass.real_estate_type. Required: the column is NOT
            NULL, so an asset without a type cannot be stored.
        issuer_id:
          type: integer
          description: Identifier from ass.issuer, the legal vehicle issuing the shares
        address:
          $ref: "#/components/schemas/RealEstateAddress"
        specification:
          $ref: "#/components/schemas/RealEstateSpecificationInput"
        configuration:
          $ref: "#/components/schemas/RealEstateConfigurationInput"
        media:
          type: array
          items:
            $ref: "#/components/schemas/RealEstateMediaInput"

    RealEstatePatchRequest:
      type: object
      description: >
        Partial update. Every field is optional and an omitted one is left
        untouched; the sections are merged field by field, except media which
        is replaced as a whole.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        imageurl:
          type: string
        estate_type_id:
          type: integer
        issuer_id:
          type: integer
        address:
          $ref: "#/components/schemas/RealEstateAddressPatch"
        specification:
          $ref: "#/components/schemas/RealEstateSpecificationInput"
        configuration:
          $ref: "#/components/schemas/RealEstateConfigurationPatch"
        media:
          type: array
          description: Replaces the whole gallery. Send an empty array to clear it.
          items:
            $ref: "#/components/schemas/RealEstateMediaInput"

    RealEstateAddressPatch:
      type: object
      description: >
        Address fields to change. Same fields as RealEstateAddress, none
        required: what is not sent keeps its current value.
      properties:
        street:
          type: string
        street_complement:
          type: string
        postal_code:
          type: string
        city:
          type: string
        region:
          type: string
        country_code:
          type: string
          description: ISO 3166-1 alpha-2
        latitude:
          type: string
        longitude:
          type: string

    RealEstateConfigurationPatch:
      type: object
      description: >
        Share configuration fields to change. total_shares and price_per_share
        are optional here, unlike on a create, because they already have a
        value to keep.
      properties:
        total_shares:
          type: string
        price_per_share:
          type: string
        currency_code:
          type: string
        yield:
          type: string
        payment_frequency:
          type: integer
        payment_frequency_type_id:
          type: integer
        min_investment:
          type: string
        max_investment:
          type: string
        entry_fee_rate:
          type: string
        mgmt_fee_rate:
          type: string
        exit_fee_rate:
          type: string
        compartment_ref:
          type: string

    RealEstateSpecificationInput:
      type: object
      description: >
        Physical description. Measures travel as decimal strings for the same
        reason as amounts: a surface stored as NUMERIC must not come back
        rounded by a JSON parser.
      properties:
        surface_area:
          type: string
          example: "128.50"
        lot_size:
          type: string
          example: "450"
        pool_size:
          type: string
        terrace_size:
          type: string
        bedroom_number:
          type: integer
          minimum: 0
        bathroom_number:
          type: integer
          minimum: 0
        build_year:
          type: integer
          minimum: 1000
        energy_class:
          type: string
          description: A to G
          example: C
        ges_class:
          type: string
          description: A to G
          example: D

    RealEstateConfigurationInput:
      type: object
      description: >
        Share configuration. total_valuation is absent on purpose: the database
        computes it from total_shares x price_per_share and refuses any write,
        which is what keeps the three values from ever disagreeing.
      required:
        - total_shares
        - price_per_share
        - currency_code
        - payment_frequency
        - payment_frequency_type_id
      properties:
        total_shares:
          type: string
          description: Exact positive integer, NUMERIC(20,0)
          example: "1500"
        price_per_share:
          type: string
          description: Exact positive decimal, NUMERIC(20,8)
          example: "199.99"
        currency_code:
          type: string
          description: >
            ISO 4217. Required with the price it applies to: an amount without
            its currency means nothing, and defaulting it would record a
            currency nobody chose.
          example: EUR
        yield:
          type: string
          description: Annual yield in percent
          example: "4.25"
        payment_frequency:
          type: integer
          minimum: 1
          description: >
            How many times per period the yield is paid. Required with the
            yield: a return with no rhythm cannot be compared to another one.
          example: 1
        payment_frequency_type_id:
          type: integer
          minimum: 1
          description: >
            Identifier from ass.payment_frequency_type, the period the frequency
            counts in. Required for the same reason: "4" alone says nothing.
          example: 1
        min_investment:
          type: string
        max_investment:
          type: string
        entry_fee_rate:
          type: string
          description: Percentage between 0 and 100
        mgmt_fee_rate:
          type: string
          description: Percentage between 0 and 100
        exit_fee_rate:
          type: string
          description: Percentage between 0 and 100
        compartment_ref:
          type: string
          description: Luxembourg compartment reference, unique across assets

    RealEstateMediaInput:
      type: object
      required:
        - url
      properties:
        url:
          type: string
        alt_text:
          type: string
        media_type:
          type: string
          description: image, video, floorplan or virtual_tour. Defaults to image.
          example: image
        position:
          type: integer
          minimum: 0
        is_cover:
          type: boolean
          description: At most one media per asset may be the cover.

    CreateIssuanceOrderRequest:
      type: object
      required:
        - realEstateId
        - quantity
      properties:
        realEstateId:
          type: integer
        quantity:
          type: integer

    CreateIssuanceOrderResponse:
      allOf:
        - $ref: "#/components/schemas/APIResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/IssuanceOrder"

    IssuanceOrder:
      type: object
      required:
        - userId
        - orderRef
        - tokenQuantity
        - realEstateId
        - createdAt
        - createdBy
      properties:
        id:
          type: integer
        userId:
          type: integer
        orderRef:
          type: string
        tokenQuantity:
          type: integer
        realEstateId:
          type: integer
        statusId:
          type: integer
        statusCode:
          type: string
        statusLabel:
          type: string
        statusIfFinal:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: integer
